# https://developers.openai.com/codex/config-reference

model_reasoning_effort = "high"
plan_mode_reasoning_effort = "high"
sandbox_mode = "danger-full-access"

[features]
fast_mode = false
# a node's step is one turn on one thread; sub-agent threads would let a
# step spend several threads' worth before the next cap check, so a node runs
# none
multi_agent = false
multi_agent_v2 = false

[analytics]
enabled = false
