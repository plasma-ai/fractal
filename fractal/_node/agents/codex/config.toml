# https://developers.openai.com/codex/config-reference

model_reasoning_effort = "high"
plan_mode_reasoning_effort = "high"
sandbox_mode = "danger-full-access"

[features]
fast_mode = false
# a node's step may run sub-agent threads, as a Claude node's may; the rollout
# window binds every spawned or forked thread's rollout, prices it into the
# step at its own model, or refuses the step
multi_agent = true
multi_agent_v2 = true

[analytics]
enabled = false
