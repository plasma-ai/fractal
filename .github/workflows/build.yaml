name: build

on:
  push:
    branches:
      - main
      - dev
    tags: ["v*"]
  pull_request:
    branches:
      - main
      - dev

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - name: Check tag matches package, plugin, shim, and cruft versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 - <<'PY'
          import json, os, pathlib, tomllib

          tag = os.environ['GITHUB_REF_NAME'].removeprefix('v')
          init = pathlib.Path('fractal/__init__.py').read_text()
          version_line = next(
              line for line in init.splitlines() if line.startswith('__version__')
          )
          version = version_line.split('=', 1)[1].strip().strip('\'"')
          project_version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          claude_version = json.load(open('.claude-plugin/plugin.json'))['version']
          codex_version = json.load(open('.codex-plugin/plugin.json'))['version']
          cruft = json.load(open('.cruft.json'))['context']['cookiecutter']
          shim = tomllib.load(open('shim/pyproject.toml', 'rb'))['project']
          shim_pins = shim['dependencies']
          versions = {
              '__version__': version,
              'pyproject.toml': project_version,
              '.claude-plugin/plugin.json': claude_version,
              '.codex-plugin/plugin.json': codex_version,
              '.cruft.json': cruft['project']['version'],
              'shim/pyproject.toml': shim['version'],
          }
          versions.update({pin: pin.partition('==')[-1] for pin in shim_pins})
          bad = {name: v for name, v in versions.items() if v != tag}
          if bad:
              detail = ', '.join(f'{name}={v}' for name, v in bad.items())
              raise SystemExit(f'::error::tag v{tag} != {detail}')
          print(f'All versions aligned at v{tag}')
          PY
      - name: Build wheel
        run: uv build
      - name: Build shim wheel
        run: uv build shim --out-dir dist
      - name: Check distribution metadata
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
  publish:
    name: publish
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/plasma-fractal/
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: dist
        path: dist/
    # NOTE: publishes both plasma-fractal and fractal (shim)
    - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
